# Run the 'pull' step for external pull requests. If we try this inside ci.yml we ended up with dozens of skipped dupe jobs
name: External Pull Request CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-26.04
    environment: external-ci # use this to set up required reviewers
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Registry Credentials for Fork PR
        id: fork-creds
        # if: ${{ github.event.pull_request.head.repo.fork }} # FIXME re-add for testing
        uses: ./.github/actions/get-registry-creds
        with:
          auth_service_url: "https://portal.webhare.com/portalapi/ci/get-buildcache-token"
          audience: "https://portal.webhare.com"
      - name: Trigger Fork CI via Workflow Dispatch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: context.payload.pull_request.head.ref,
              inputs: {
                cache_registry: '${{ steps.fork-creds.outputs.registry_url }}',
                cache_user: '${{ steps.fork-creds.outputs.registry_user }}',
                cache_password: '${{ steps.fork-creds.outputs.registry_password }}',
                pr_number: '${{ github.event.pull_request.number }}'
              }
            });
