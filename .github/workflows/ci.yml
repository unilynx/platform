name: WebHare CI

on:
  push:
  workflow_dispatch:
    inputs:
      cache_registry:
        description: 'Cache Registry URL'
      cache_user:
        description: 'Cache user'
      cache_password:
        description: 'Cache password'
      pr_repo:
        description: 'PR Repository Full Name'
      pr_sha:
        description: 'PR Commit SHA'
      pr_number:
        description: 'PR Number'

  workflow_call:
    inputs:
      scheduled:
        description: Skip deployment steps for scheduled CI runs
        type: boolean
        default: false

env:
  CI_COMMIT_SHA: ${{ github.sha }}
  CI_COMMIT_REF_SLUG: ci-${{ github.run_id }}
  GIT_SUBMODULE_STRATEGY: recursive

permissions:
  contents: read
  packages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency: # cancel older workflows when a new push is done on a branch
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buildcontainer:
    name: Build container
    # See https://github.com/actions/runner-images
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pr_repo || github.repository }}
          ref: ${{ inputs.pr_sha || github.sha }}
          submodules: recursive
      - name: Set CI_REGISTRY_IMAGE to retrieved value or fallback to ghcr.io
        env:
          CI_REGISTRY_IMAGE: ${{ inputs.cache_registry  }}
        run: |
          [ -n "$CI_REGISTRY_IMAGE" ] || CI_REGISTRY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE" >> "$GITHUB_ENV"
      - name: Log in to registry with Podman
        env:
          CI_REGISTRY_USER: ${{ inputs.cache_user || github.actor }}
          CI_REGISTRY_PASSWORD: ${{ inputs.cache_password || secrets.GITHUB_TOKEN }}
        run: echo "$CI_REGISTRY_PASSWORD" | podman login "$CI_REGISTRY_IMAGE" --username "$CI_REGISTRY_USER" --password-stdin
      - name: Build and push WebHare container
        env:
          PUSH_BUILD_IMAGES: "1"
        run: |
          args=(--podman)
          whtree/bin/wh buildcontainer "${args[@]}"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildcontainer-artifacts
          path: artifacts/
          if-no-files-found: ignore

  test-vscode-extension:
    name: VS Code extension tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: addons/vscode-extension/scripts/run-extension-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-extension-artifacts
          path: artifacts/
          if-no-files-found: ignore

  testcontainers:
    name: ${{ matrix.name }}
    needs: buildcontainer
    environment: ${{ github.event.pull_request.head.repo.fork && 'external-forks' || null }}
    env:
      CI_REGISTRY_IMAGE: ${{ inputs.cache_registry || vars.CI_REGISTRY_IMAGE }}
      CI_REGISTRY_USER: ${{ inputs.cache_user || github.actor }}
      CI_REGISTRY_PASSWORD: ${{ inputs.cache_password || secrets.GITHUB_TOKEN }}
    if: needs.buildcontainer.result == 'success'
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: baselibs, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external baselibs', allow_failure: false }
          - { name: modules, command: 'addons/docker-build/testcontainer.sh --podman --tag=-external checkmodules', allow_failure: false }
            #We need --noautomoduledir to prevent testmodule just using CI_PROJECT_DIR (which takes precedence over $1)
            #We need --webhareimage because --module makes webhareimage default to 'main'
          - { name: devkit, command: 'TESTFW_WEBHARE_ENABLE_DEVKIT=1 addons/docker-build/testcontainer.sh --podman --noautomoduledir --webhareimage "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA" --module "$(pwd)/whtree/modules/devkit', allow_failure: false }
          - { name: publisher, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,-forms publisher,socialite', allow_failure: false }
          - { name: publisher-forms, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=forms publisher', allow_failure: false }
          - { name: system, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,-nodejs system', allow_failure: false }
          - { name: system-nodejs, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,nodejs system', allow_failure: false }
          - { name: webdesign, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external publisher-webdesign', allow_failure: false }
          - { name: database, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external wh.database', allow_failure: false }
          - { name: tollium, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external tollium', allow_failure: false }
          - { name: consilio, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external consilio', allow_failure: false }
          - { name: core, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external --generatexmltests wh.hscore', allow_failure: false }
          - { name: webserver, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external wh.webserver', allow_failure: false }
          - { name: wrd, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,-wrd-legacy,-wrd-nodejs wrd', allow_failure: false }
          - { name: wrd-legacy, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,wrd-legacy wrd', allow_failure: false }
          - { name: wrd-nodejs, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external,wrd-nodejs wrd', allow_failure: false }
          - { name: jscomponents, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=-external wh.jscomponents', allow_failure: false }
          - { name: external, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --tag=external', allow_failure: true }
          - { name: two-hares, command: 'addons/docker-build/testcontainer.sh --podman --nocheckmodule --twohares --testscript $PWD/whtree/modules/webhare_testsuite/scripts/whcommands/twoharetests.sh', allow_failure: false }
          - { name: backup-restore, command: 'TESTFW_SKIP_FINALIZE_CI=1 addons/docker-build/testcontainer.sh --podman --nocheckmodule --testscript $PWD/whtree/modules/webhare_testsuite/scripts/whcommands/backup-restore-test.sh', allow_failure: false }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set container registry image to ghcr.io fallback
        if: ${{ env.CI_REGISTRY_IMAGE == '' }}
        run: echo "CI_REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to registry with Podman
        run: echo "$CI_REGISTRY_PASSWORD" | podman login "$CI_REGISTRY_IMAGE" --username "$CI_REGISTRY_USER" --password-stdin
      - name: Run test container
        run: BUILD_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA" ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.name }}-artifacts
          path: artifacts/
          if-no-files-found: ignore

  # we need this step for our GitHub approval settings to have some clear check they can require
  all-tests-passed:
    name: All tests passed
    needs: [buildcontainer, test-vscode-extension, testcontainers]
    # The gate must run even when a dependency fails so the required check reports failure rather than skipped.
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Verify all tests passed
        if: >-
          needs.buildcontainer.result != 'success' ||
          needs.test-vscode-extension.result != 'success' ||
          needs.testcontainers.result != 'success' ||
          needs.test-devkit.result != 'success'
        run: exit 1
      - run: echo "All tests passed successfully."

  deploy:
    name: Deploy container
    needs: [all-tests-passed]
    if: github.ref == 'refs/heads/main' && !inputs.scheduled
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set container registry image
        run: echo "CI_REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR with Podman
        run: echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io --username '${{ github.actor }}' --password-stdin
      - run: BUILD_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA" addons/docker-build/deploydocker.sh
        env:
          PUSH_BUILD_IMAGES: "1"
          USEPODMAN: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-artifacts
          path: artifacts/
          if-no-files-found: ignore

  update-testscripts:
    name: Update test scripts
    needs: [all-tests-passed]
    if: github.ref == 'refs/heads/main' && !inputs.scheduled
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update test scripts when credentials are configured
        if: ${{ env.WHBUILD_BUILDBOTPASSWORD != '' }}
        run: addons/deploy_testscripts.sh
        env:
          WHBUILD_BUILDBOTPASSWORD: ${{ secrets.WHBUILD_BUILDBOTPASSWORD }}
